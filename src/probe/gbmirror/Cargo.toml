[package]
name = "gbmirror"
version = "0.1.0"
edition = "2021"
description = "GUIBridge hidden-desktop live mirror + hardware recorder (host zero-interference)"

[dependencies]
serde_json = "1.0"
windows = { version = "0.61", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Foundation",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Storage_Xps",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"