[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guibridge"
version = "0.1.0"
description = "Semantic GUI control middleware for AI agents"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "uiautomation>=2.0.18",
    "mss>=9.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",  # official surface (packages/mcp) uses the 2.x MCPServer; experimental mcp_gateway needs 1.x in a separate env
    "pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
markers = ["live: requires a running Trae instance on this machine"]
testpaths = ["tests"]