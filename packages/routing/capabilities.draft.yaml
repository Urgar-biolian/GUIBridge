# DRAFT measured capability table — pending B-line approval (design doc §11).
# Risk values are MEASURED in Phase 1 experiments, not assumed. Channels absent
# from an entry were not measured and stay unavailable. UNKNOWN risk is never
# auto-allowed (policy.py); it surfaces a measurement gap rather than guessing.
status: draft
schema_version: 1
entries:
  - app: native-test
    operation: invoke
    channels:
      uia: {supported: true, risk: focus_switch}
      foreground_input: {supported: true, risk: physical_input}
    evidence:
      - "run 20261117T082451Z E1b: 3/3 background invoke, cursor 0, foreground switched to target"
      - "run 20261117T090104Z E1c: 3/3 foreground-start invoke, transient focus switch, external_input false"
      - "run 20261117T082451Z E3: SendInput click verified, physical_input interference"

  - app: native-test
    operation: set_value
    channels:
      uia: {supported: true, risk: focus_switch}
      foreground_input: {supported: true, risk: physical_input}
    evidence:
      - "run 20261117T082451Z E1b: 3/3 background SetValue initial->bg-value, cursor 0, foreground switch"
      - "run 20261117T090104Z E1c: 3/3 foreground-start SetValue, transient focus switch"
      - "run 20261117T082451Z E3: SendInput text verified, cursor displacement 95px"

  - app: native-test
    operation: toggle
    channels:
      uia: {supported: true, risk: focus_switch}
      foreground_input: {supported: true, risk: physical_input}
    evidence:
      - "run 20261117T082451Z E1b: 3/3 background Toggle off->on, cursor 0, foreground switch"
      - "run 20261117T090104Z E1c: 3/3 foreground-start Toggle, transient focus switch"
      - "run 20261117T082451Z E3: SendInput checkbox click verified, cursor displacement 41px"

  - app: trae
    operation: send_task
    channels:
      app_protocol: {supported: true, risk: unknown}
      uia: {supported: false, risk: unknown}
    notes: >
      APP_PROTOCOL (loopback CDP) functionally proven: F3/F6/F12 submit->status->readback
      and authorized live Chat reply OK (run 20261117T090104Z). The read path is measured
      interference-free (run 20261117T092712Z, see get_task_status/read_task_result), but the
      send click itself has NOT been FocusGuard-measured, so send_task risk stays unknown
      pending an authorized live measurement; it must not be assumed logical_only. UIA exposes
      no chat composer/send (E5, 111 framework nodes only).
    evidence:
      - "src/probe/PROBE_REPORT.md F3/F6/F12; run 20261117T090104Z E6 live Chat OK"
      - "run 20261117T090104Z E5: Trae UIA tree has no chat composer/send"

  - app: trae
    operation: get_task_status
    channels:
      app_protocol: {supported: true, risk: none}
      uia: {supported: false, risk: unknown}
    notes: >
      Read-only CDP Runtime.evaluate wrapped in FocusGuard: 5/5 cursor 0, no foreground
      switch, no external input (run 20261117T092712Z). Measured interference-free for the
      read path; does not imply send_task's send click is interference-free.
    evidence:
      - "run 20261117T092712Z trae_cdp_focus: clean 5/5, no_interference 5/5, measured_read_risk none"

  - app: trae
    operation: read_task_result
    channels:
      app_protocol: {supported: true, risk: none}
      uia: {supported: false, risk: unknown}
    notes: >
      Read-only CDP conversation readback wrapped in FocusGuard: 5/5 cursor 0, no foreground
      switch, no external input (run 20261117T092712Z). Readback text stays untrusted data.
    evidence:
      - "run 20261117T092712Z trae_cdp_focus: clean 5/5, no_interference 5/5, measured_read_risk none"

  - app: wechat
    operation: send_message
    channels:
      uia: {supported: false, risk: unknown}
    unsupported_reason: >
      wechat 4.x: visible window only 4 UIA framework nodes (Window/2 Pane/TitleBar),
      no Edit/Button — run 20261117T090104Z E5 (PID-matched EnumWindows scan).
    evidence:
      - "run 20261117T090104Z E5: hwnd 133592 class Qt51514QWindowIcon, node_count 4, has_edit false, has_button false"